name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail only on prod-dependency high/critical advisories. Dev-only tooling
      # vulns (vitest/vite/etc.) don't ship and are tracked separately.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  snyk:
    name: Snyk (optional — runs when SNYK_TOKEN is set)
    runs-on: ubuntu-latest
    # GitHub does not permit the secrets context directly in an `if`
    # expression. Expose the optional token only to this job, then test the
    # environment variable so the workflow remains valid when Snyk is unset.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high
